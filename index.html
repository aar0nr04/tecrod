<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECROD</title>
  <script>
    (function(){
      function detect(){
        try{
          var saved = localStorage.getItem("tecrod_lang");
          if(saved === "es" || saved === "en") return saved;
        }catch(e){}
        var nav = (navigator.language || "en").toLowerCase();
        return nav.startsWith("es") ? "es" : "en";
      }
      var lang = detect();
      var base = window.location.pathname.split("/").filter(Boolean)[0] || "";
      var isRepo = base && base !== "en" && base !== "es";
      var prefix = isRepo ? ("/" + base) : "";
      window.location.replace(prefix + "/" + lang + "/");
    })();
  </script>
</head>
<body></body>
</html>
